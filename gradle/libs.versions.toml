[versions]
activity = "1.13.0"
agp = "8.7.3"
apache-commons-io = "2.22.0"
coil = "3.1.0"
compose-bom = "2025.01.01"
compose-compiler = "1.5.15"
core = "1.15.0"
coroutines = "1.9.0"
datastore = "1.1.1"
exif-interface = "1.1.0"
hilt = "2.53.1"
hilt-navigation-compose = "1.2.0"
kotlin = "2.1.0"
metadata-extractor = "2.21.1"
navigation = "2.8.5"
orbit = "11.0.0"
timber = "5.0.1"
wire = "5.2.0"
lifecycle = "2.8.7"
window = "1.3.0"

[libraries]
# Compose BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
# AndroidX
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
window = { group = "androidx.window", name = "window", version.ref = "window" }
window-core = { group = "androidx.window", name = "window-core", version.ref = "window" }
# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
# DataStore
datastore-prefs = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
datastore-core = { group = "androidx.datastore", name = "datastore-core", version.ref = "datastore" }
# Other
apache-commons-io = { group = "commons-io", name = "commons-io", version.ref = "apache-commons-io" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
exif-interface = { group = "io.github.tommy-geenexus", name = "exif-interface-extended", version.ref = "exif-interface" }
metadata-extractor = { group = "com.drewnoakes", name = "metadata-extractor", version.ref = "metadata-extractor" }
orbit-vm = { group = "org.orbit-mvi", name = "orbit-viewmodel", version.ref = "orbit" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
wire-runtime = { group = "com.squareup.wire", name = "wire-runtime", version.ref = "wire" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[bundles]
implementation = [
    "activity-compose",
    "apache-commons-io",
    "coil-compose",
    "core-ktx",
    "coroutines-android",
    "datastore-prefs",
    "datastore-core",
    "exif-interface",
    "hilt-android",
    "hilt-navigation-compose",
    "lifecycle-runtime-compose",
    "lifecycle-viewmodel-compose",
    "metadata-extractor",
    "navigation-compose",
    "orbit-vm",
    "timber",
    "wire-runtime",
    "window",
    "window-core",
]
kapt = [
    "hilt-android-compiler",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.1.0-1.0.29" }
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
wire = { id = "com.squareup.wire", version.ref = "wire" }
