[versions]
activity = "1.13.0"
agp = "9.2.1"
apache-commons-io = "2.22.0"
appcompat = "1.8.0"
coil = "3.6.3"
compose-bom = "2026.09.00"
core = "1.19.1"
coroutines = "1.11.0"
dagger-hilt = "2.60.1"
datastore = "1.3.0"
exif-interface = "1.1.0"
fragment = "1.9.1"
material = "1.14.0"
metadata-extractor = "2.22.0"
navigation = "2.10.2"
orbit = "12.0.1"
phoenix = "3.0.0"
timber = "5.0.1"
wire = "7.1.2"
lifecycle = "2.11.0"
window = "1.5.1"
junit = "4.13.2"
mockk = "1.14.12"
robolectric = "4.17"
turbine = "1.2.1"

[libraries]
# Compose BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
# AndroidX
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core" }
documentfile = { group = "androidx.documentfile", name = "documentfile", version = "1.1.0" }
fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
window = { group = "androidx.window", name = "window", version.ref = "window" }
window-core = { group = "androidx.window", name = "window-core", version.ref = "window" }
# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "dagger-hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "dagger-hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.4.0" }
# Material
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# DataStore
datastore-prefs = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
datastore-core = { group = "androidx.datastore", name = "datastore-core", version.ref = "datastore" }
# Other
apache-commons-io = { group = "commons-io", name = "commons-io", version.ref = "apache-commons-io" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
exif-interface = { group = "io.github.tommy-geenexus", name = "exif-interface-extended", version.ref = "exif-interface" }
metadata-extractor = { group = "com.drewnoakes", name = "metadata-extractor", version.ref = "metadata-extractor" }
phoenix = { group = "com.jakewharton", name = "process-phoenix", version.ref = "phoenix" }
orbit-vm = { group = "org.orbit-mvi", name = "orbit-viewmodel", version.ref = "orbit" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
wire-runtime = { group = "com.squareup.wire", name = "wire-runtime", version.ref = "wire" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[bundles]
implementation = [
    "activity-compose",
    "apache-commons-io",
    "appcompat",
    "coil-compose",
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-material3",
    "core-ktx",
    "coroutines-android",
    "datastore-prefs",
    "datastore-core",
    "documentfile",
    "exif-interface",
    "fragment-ktx",
    "hilt-android",
    "hilt-navigation-compose",
    "lifecycle-runtime-compose",
    "lifecycle-viewmodel-compose",
    "material",
    "metadata-extractor",
    "navigation-compose",
    "navigation-fragment-ktx",
    "navigation-ui-ktx",
    "orbit-vm",
    "phoenix",
    "timber",
    "wire-runtime",
    "window",
    "window-core",
]
kapt = [
    "hilt-android-compiler",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.10" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version = "2.4.0" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version = "2.4.0" }
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "dagger-hilt" }
wire = { id = "com.squareup.wire", version.ref = "wire" }
